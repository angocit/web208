<h1>Thêm sản phẩm</h1>
<form [formGroup]="productform">
    <input formControlName="name" type="text" placeholder="Tên sản phẩm" />
    <input formControlName="image" type="text" placeholder="Ảnh sản phẩm" />
    <input formControlName="price" type="text" placeholder="Giá sản phẩm" />
    <button type="submit">Thêm mới</button>
</form>
