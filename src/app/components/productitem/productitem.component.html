<div>
    <img [src]="product.image" width="400"/>
    <span></span>
    <h3 [style]="{'color':'red','font-weight':'bold'}">{{product.title}}</h3>
    <span>Price: {{product.price}}</span>
    <button (click)="onDelete(product.id)">Xóa</button>
    <button [ngClass]="(product.price>50)?'bg-red-800 px-4 py-2 text-white':'bg-blue-800 px-4 py-2 text-white'">Add to cart</button>
</div>
