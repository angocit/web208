    @for (product of products; track product.id) {

    }
</ul> -->
<nz-table #productsTable [nzData]="products">
  <thead>
    <tr>
      <th>STT</th>
      <th>Tên sản phẩm</th>
      <th>Ảnh sản phẩm</th>
      <th>Giá tiền</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (product of productsTable.data; track product.id; let i = $index) {
    <tr>
      <td>{{i+1}}</td>
      <td>{{product.name}}</td>
      <td><img [src]="product.image" width="90"/></td>
      <td>{{product.price}}</td>
      <td>
        Sửa | Xóa
      </td>
    </tr>
}
  </tbody>
</nz-table>
