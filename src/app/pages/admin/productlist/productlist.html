<h1>Danh sách sản phẩm</h1>
<!-- <ul>
    @for (product of products; track product.id) {
        <li [routerLink]="['/admin/products',product.id]">{{product.name}}</li>
    }
</ul> -->
<nz-table #productsTable [nzData]="products()">
  <thead>
    <tr>
      <th>STT</th>
      <th>Tên sản phẩm</th>
      <th>Ảnh sản phẩm</th>
      <th>Giá tiền</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (product of productsTable.data; track product.id; let i = $index) {
    <tr>
      <td>{{i+1}}</td>
      <td>{{product.name}}</td>
      <td><img [src]="product.image" width="90"/></td>
      <td>{{product.price}}</td>
      <td>
         <button [routerLink]="['/admin/products/edit',product.id]" nz-button nzType="primary">Sửa</button>
         <button nz-popconfirm
      nzPopconfirmTitle="Bạn thực sự muốn xóa?"
      nzOkText="Đồng ý"
      nzCancelText="Hủy"
      (nzOnConfirm)="handleDelete(product.id)" nz-button nzDanger nzType="primary">Xóa</button>
      </td>
    </tr>
}
  </tbody>
</nz-table>
