<h1>Danh sách sản phẩm</h1>
<table>
    <thead>
        <tr>
            <th>STT</th>
            <th>Tên sản phẩm</th>
            <th>Ảnh</th>
            <th>Giá tiền</th>
            <th>Thao tác</th>
        </tr>
    </thead>
    <tbody>
        @for (product of products;track product.id;let idx=$index){
            <tr>
                <td>{{idx+1}}</td>
                <td>{{product.name}}</td>
                <td><img width="90" src={{product.image}}/></td>
                <td>{{product.price}}</td>
                <td>
                    <button [routerLink]="['/admin/products/edit',product.id]">Sửa</button>
                    <button (click)="handleDelete(product.id)">Xóa</button>
                </td>
            </tr>
        }
    </tbody>
</table>
