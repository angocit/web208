<header class="shadow py-2">
  <div class="max-w-7xl mx-auto">
    <div class="flex w-full gap-x-10">
    <div class="logo">
      <svg width="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
        <!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
        <path
          d="M0 32l34.9 395.8L191.5 480l157.6-52.2L384 32H0zm308.2 127.9H124.4l4.1 49.4h175.6l-13.6 148.4-97.9 27v.3h-1.1l-98.7-27.3-6-75.8h47.7L138 320l53.5 14.5 53.7-14.5 6-62.2H84.3L71.5 112.2h241.1l-4.4 47.7z"
        />
      </svg>
    </div>
    <div class="flex justify-between w-full items-center">
    <div class="search">
        <form class="py-1 min-w-[300px] px-2 border border-[#ccc] rounded flex justify-between">
            <input class="w-full outline-0" placeholder="Tìm kiếm" type="text"/>
            <button><svg width="20" fill="#ccc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M505 442.7L405.3 343c-4.5-4.5-10.6-7-17-7H372c27.6-35.3 44-79.7 44-128C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c48.3 0 92.7-16.4 128-44v16.3c0 6.4 2.5 12.5 7 17l99.7 99.7c9.4 9.4 24.6 9.4 33.9 0l28.3-28.3c9.4-9.4 9.4-24.6 .1-34zM208 336c-70.7 0-128-57.2-128-128 0-70.7 57.2-128 128-128 70.7 0 128 57.2 128 128 0 70.7-57.2 128-128 128z"/></svg></button>
        </form>
    </div>
    <nav>
      <ul class="flex gap-4">
            @for (menu of menus; track menu.id;let i=$index){
                @if (i==0){
                <li>
                    <a class="text-red-800" [href]="menu.url">{{menu.name}}</a>
                </li>
                }
                @else {
                  <li>
                    <a [href]="menu.url">{{menu.name}}</a>
                </li>
                }
            }
      </ul>
    </nav>
    </div>
    </div>
  </div>
</header>
