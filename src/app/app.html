<app-header/>
<div>
<P>Đây là content  
</P>
<button (click)="handleClick()">
    @if(show){
    Ẩn
    }@else {
        Hiện
    }
</button>
</div>
@if(show){
    <h2>Xin chào WD20203</h2>
}
<input placeholder="Nhập title" [(ngModel)]= "title"/>
{{title}}
<button (click)="LoadProduct()">Tải sản phẩm</button>
<h1>Danh sách sản phẩm</h1>
<table>
    <thead>
    <tr>
        <th>STT</th>
        <th>Tên sản phẩm</th>
        <th>Giá tiền</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
        @for (product of products;track product.id;let i = $index;let even = $even){
            <tr [class.red]="even" [style.background]="'blue'">
                <td>{{i+1}}</td>
                <td [style.color]="'yellow'">{{product.name}}</td>
                <td [style]="{color:'red',background:'white'}">{{product.price}}</td>
                <td><button (click)="handleDelete(product.id)">Xóa</button></td>
            </tr>
        }
    </tbody>
</table>
<app-footer/>
