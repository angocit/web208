<app-header/>
<div>
    <input type="text" placeholder="Nhập gì đó" [(ngModel)] = "title"/>
    <p>Giá trị ô input: {{title}}</p>
<h1>Nội dung content</h1>
<button (click)="handleClick()">
   {{(show)?'Hiện':'Ẩn'}}
</button>
</div>
@if (show){
    <p>Nội dung được hiển thị</p>
}
@else {
    <p>Nội dung bị ẩn</p>
}
<h1>Danh sách sản phẩm</h1>
@for (product of products; track product.id){
    <app-productitem [product]="product"/>
}
<app-footer/>
