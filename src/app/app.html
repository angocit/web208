<app-header/>
<h1>{{title}}</h1>
<h2>Phần 1. Thuộc tính</h2>
<h3 [class] = "classname" class="title">Thuộc tính class</h3>
<h3 [class] = "[classname,'text',fontweight]">Nhiều class</h3>
<h3 [class.active] = "show">Hiển thị class phụ thuộc biến</h3>
<p>Style</p>
<h3 [style] = "{'background':color,'color':'white'}" class="title">Thuộc tính style</h3>
<h3 [style.background] = "color" class="title">Gán giá trị  cho thuộc tính style</h3>
<h2>Phần 2. Sự kiện</h2>
<button (click)="handleClick()">Thay đổi trạng thái</button>
<h2>Phần 3. Tương tác 2 chiều (two way binding)</h2>
<input type="text" placeholder="Nhập gì đó" [(ngModel)]="title"/>
<h2>Ứng dụng. Tạo chương trình tính diện tích hình chữ nhật</h2>
<label> Chiều dài
<input type="number" min="1" [(ngModel)] ="chieudai"/>
</label>
<label> Chiều rộng
<input type="number" min="1" [(ngModel)] ="chieurong"/>
</label>
<button (click)="Caculator()">Tính</button>
<label> Diện tích
<input type="number" min="1" [(ngModel)] ="dientich"/>
</label>
